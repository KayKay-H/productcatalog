<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" th:href="@{/css/style.css}">

<title>Products</title>

</head>

<body class="container mt-5">

<h2>Products</h2>

<form method="get" action="/products" class="row g-3 mb-4">

<div class="col">
<input type="text" name="brand" placeholder="Brand" class="form-control">
</div>

<div class="col">
<input type="text" name="category" placeholder="Category" class="form-control">
</div>

<div class="col">
<button class="btn btn-primary">Search</button>
</div>

</form>

<table class="table table-bordered">

<thead>
<tr>
<th><a th:href="@{/products(sort='name')}">Name</a></th>
<th><a th:href="@{/products(sort='brand')}">Brand</a></th>
<th>Price</th>
<th>Category</th>
</tr>
</thead>

<tbody>

<tr th:each="p:${products.content}">
<td th:text="${p.name}"></td>
<td th:text="${p.brand}"></td>
<td th:text="${p.price}"></td>
<td th:text="${p.category}"></td>
</tr>

</tbody>

</table>

</body>
</html>
